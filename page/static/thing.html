<style>
    .grid {
        height: 100%;
        width: 100%;

        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr 1fr;
        gap: 8px;

        position: relative;
        z-index: 1;
    }

    .blockWrapper {
        width: 100%;
        height: 100%;
    }

    .block {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border-radius: 25px;
        padding: 16px;

        background-color: var(--color);
        outline: var(--color) 0px solid;
        transition: outline 0.1s cubic-bezier(0.2, 0, 0.6, 1);
    }

    .block:hover {
        outline: var(--color) 6px solid;
        cursor: pointer;
    }

    .block:active {
        position: absolute;
        top: 0;
        right: 0;
    }

    .blockTitle {
        margin-top: 0;
        text-align: right;
        color: var(--darkerColor);
    }

    .main {
        grid-area: 1 / 2 / 4 / 5;
    }

    .gray {
        --color: #d9d9d9;
        --darkerColor: #444444;
    }

    .blue {
        --color: #cae4fb;
        --darkerColor: #003b6b;
    }

    .red {
        --color: #ffcfdb;
        --darkerColor: #c41230;
    }

    .green {
        --color: #d2ecd3;
        --darkerColor: #004700;
    }

    .orange {
        --color: #ffcf9e;
        --darkerColor: #ff7d00;
    }

    .purple {
        --color: #cccde6;
        --darkerColor: #571b93;
    }

    .pink {
        --color: #ffcfdb;
        --darkerColor: #ff006e;
    }

    #fundsFlowGraph {
        height: calc(100% - 10rem);

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .mainViz {
        width: fit-content;
        height: fit-content;
        max-width: 100%;
        max-height: 100%;
    }

    select {
        background-color: transparent;
        border-radius: 5px;
        border: solid 2px var(--darkerColor);
        color: var(--darkerColor);
    }

    @keyframes loading {
        from {
            stroke-dashoffset: 0;
        }
        to {
            stroke-dashoffset: 100%;
        }
    }
</style>
